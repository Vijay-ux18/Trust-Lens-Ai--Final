# ==============================================================================
# TrustLens AI - Application Configuration Settings
# ==============================================================================

# Machine Learning Training Parameters
model:
  test_size: 0.3
  random_state: 42
  n_estimators: 150
  min_samples_split: 2
  min_samples_leaf: 1
  max_depth: null

# Endpoint Security Parsing Restraints
security:
  enforce_aslr_dep: true
  max_file_size_mb: 50.0

# User Interface Aesthetics
ui:
  theme: "dark-blue"
  primary_color: "#1e3c72"
  font_family: "Outfit"
